# The AI proxy for Fuel & Burn: the app sends food text here, never to OpenAI directly,
# so the API key stays on Cloudflare. Deploy with `npm run deploy` from this folder.
name = "fuel-ai"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Also on the site's own domain: in Spain, ISPs block Cloudflare's shared workers.dev addresses during
# LaLiga matches, while the site's addresses stay reachable. Same domain as the app, so AI works whenever the app loads.
routes = [{ pattern = "mikhaylova.dev/fuel/api/*", zone_name = "mikhaylova.dev" }]
# Kept for installed copies of the app from before the move.
workers_dev = true

[vars]
# Pages allowed to call the proxy, besides local dev servers.
ALLOWED_ORIGINS = "https://mikhaylova.dev"
MODEL = "gpt-5.4-mini"
TRANSCRIBE_MODEL = "gpt-4o-mini-transcribe"
# Requests a day from one IP address.
DAILY_LIMIT = "100"

# Short bursts: at most 10 requests a minute from one IP address.
[[ratelimits]]
name = "BURST"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Daily counters (created with `wrangler kv namespace create USAGE`).
[[kv_namespaces]]
binding = "USAGE"
id = "3083194967114105800138b053af0709"

# The key is a secret, not a var: `npx wrangler secret put OPENAI_API_KEY`.
# For `npm run dev`, put OPENAI_API_KEY=... in .dev.vars (never committed).
